<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Review portal{% endblock %}</title>
<style>
:root{--bg:#fcfcfb;--panel:#ffffff;--ink:#0b0b0b;--ink2:#52514e;--line:#e6e5e1;--accent:#2a78d6;--soft:#f3f2ef;--ok:#0a7a3a;--warn:#9a5b00;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1a19;--panel:#222221;--ink:#f0efec;--ink2:#c3c2b7;--line:#3a3a38;--accent:#3987e5;--soft:#2a2a28;--ok:#4cc27a;--warn:#e0a040;--bad:#f2837b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{border-bottom:1px solid var(--line);background:var(--panel)}header .in{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header a{color:var(--ink);text-decoration:none;font-weight:600}header .sp{flex:1}main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:28px 0 8px}h3{font-size:15px;margin:16px 0 6px}.muted{color:var(--ink2);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--ink2);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;border:1px solid var(--line);font-size:12px;font-weight:600;background:var(--soft)}.badge.ok::before{content:"\2713  ";color:var(--ok)}.badge.warn::before{content:"! ";color:var(--warn)}.badge.bad::before{content:"\2717  ";color:var(--bad)}
button,.btn{font:inherit;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.danger{color:var(--bad)}
input,select,textarea{font:inherit;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);max-width:100%}textarea{width:100%;min-height:70px}
.flash{background:var(--soft);border-left:4px solid var(--accent);padding:8px 12px;border-radius:6px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.kpi b{display:block;font-size:22px}
code,pre{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--soft);border-radius:6px}pre{padding:8px;overflow:auto;white-space:pre-wrap}iframe{width:100%;height:760px;border:1px solid var(--line);border-radius:8px;background:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.warnbox{border-left:4px solid var(--warn);background:var(--soft);padding:8px 12px;border-radius:6px}.badbox{border-left:4px solid var(--bad);background:var(--soft);padding:8px 12px;border-radius:6px}
</style></head><body>
<header><div class="in"><a href="{{ url_for('home') }}">Roll-rate review portal</a><span class="sp"></span>{% if me %}<span class="muted">{{ me.username }} ({{ me.role }}{% if me.lender %}, {{ LENDERS[me.lender] }}{% endif %})</span>
<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf }}"><button>Sign out</button></form>{% endif %}</div></header>
<main>{% with m = get_flashed_messages() %}{% for x in m %}<div class="flash" role="status">{{ x }}</div>{% endfor %}{% endwith %}{% block body %}{% endblock %}</main></body></html>
